name: Docker Image Build and Test

on:
  workflow_dispatch:
    inputs:
      BASE_IMAGE_NAME:
        description: 'Docker Base Image'
        type: choise
        Default: 'debain:trixie-slim'
        required: true
        options:
          - 'debain:bullseye-slim'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Private Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ inputs.BASE_IMAGE_NAME}}:latest # Replace with your image tag
          build-args: |
            TZ=Europe/London # Example timezone

 